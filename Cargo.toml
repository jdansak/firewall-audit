[package]
name = "firewall-audit"
version = "0.1.0"
edition = "2021"
description = "Cross-platform kernel-event firewall audit tool for identifying minimal firewall pinholes"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
csv = "1.3"
ctrlc = { version = "3.4", features = ["termination"] }
dns-lookup = "2.0"
serde = { version = "1.0", features = ["derive"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-service = "0.7"
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_System_Diagnostics_Etw",
    "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = "3.10"

[profile.release]
opt-level = 3
lto = true
